<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0e17" />
    <title>Nison Analytics — анализ рынка по методу Нисона</title>
    <!-- П.5: CSP в production отдают заголовки хостинга (netlify.toml / vercel.json /
         public/_headers), в dev — плагин devSecurityHeaders() из vite.config.ts.
         Font Awesome удалён: fa-* классы в коде не используются, иконки — lucide-react. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://api.bybit.com wss://stream.binance.com:9443; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <style>
      /* 内联样式确保主题色立即生效，避免闪烁 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.light,
      html.light body {
        background-color: #ffffff !important;
        color: #000000;
      }
      html.dark,
      html.dark body {
        background-color: #1a1a1a !important;
        color: #ffffff;
      }
    </style>
    <script>
      // 在 React 加载前立即设置主题，避免闪烁
      (function () {
        const isInIframe = window.self !== window.top;

        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }

        if (isInIframe) {
          // Разрешаем сообщения только от непосредственного родителя (event.source === window.parent)
          // 监听父窗口主动推送的主题消息
          window.addEventListener("message", function (event) {
            // Безопасность: принимаем сообщения только от окна-родителя, а не от любого источника
            if (event.source !== window.parent) return;
            if (event.data && typeof event.data.theme === "string") {
              const theme = event.data.theme;
              if (theme === "light" || theme === "dark") {
                applyThemeToDOM(theme);
              }
            }
          });
        } else {
          // 非 iframe 环境，使用默认 light 主题
          applyThemeToDOM("light");
        }
      })();
    </script>

    <script type="module" crossorigin src="/assets/index-sMrpemIi.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Cl5YJDbV.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
