# Kairi Analytics — nginx-конфиг для домена kairi.pro (HTTP + редирект на HTTPS)
# DNS: A-запись kairi.pro и www.kairi.pro -> IP сервера

# HTTP: редирект всего трафика на HTTPS
server {
    listen 80 default_server;
    server_name kairi.pro www.kairi.pro _; # TODO: удалить "_" после смены A-записи 95.163.244.138 на IP сервера;

    # ACME-челленджи для certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: основное приложение
server {
    listen 443 ssl default_server;
    http2 on;
    server_name kairi.pro www.kairi.pro;

    ssl_certificate     /etc/letsencrypt/live/kairi.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kairi.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/nison-analytics;
    index index.html;

    # SPA-fallback: все маршруты -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статика с хэшами в именах — кэшируем надолго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html не кешируем: иначе браузер показывает старый билд
    # со ссылками на устаревшие чанки (белый экран после деплоя)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # CSP: приложение обращается к публичным API Bybit (REST) и Binance (WS)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.bybit.com wss://stream.bybit.com wss://stream.binance.com:9443 https://stream.binance.com; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'none'; upgrade-insecure-requests;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
