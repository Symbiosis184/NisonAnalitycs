# Nison Analytics — продакшен-конфиг nginx (П.4/П.5)
# Размещение статики: /var/www/nison-analytics (права: www-data:www-data, 644/755)
# Проверка: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;                      # замените на ваш домен, напр. nison.example.com

    root /var/www/nison-analytics;
    index index.html;

    # --- П.5: заголовки безопасности (совпадают с netlify.toml) ---
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://api.bybit.com wss://stream.binance.com:9443; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # HSTS включайте только после того, как работает HTTPS (certbot):
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- hashed-ассеты из Vite: кэш на год (имя файла меняется при изменении) ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA-fallback для react-router (обязательно!) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html не кэшируем — иначе обновления не будут видны
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
